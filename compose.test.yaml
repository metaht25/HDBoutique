# Entorno aislado y desechable: credenciales sinteticas, sin puertos ni datos reales.
# Ejecutar con -p hdboutique-test y sin superponer archivos de desarrollo.
name: hdboutique-test

services:
  db:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_DB: hdboutique_test
      POSTGRES_USER: hdboutique_test_owner
      POSTGRES_PASSWORD: isolated-test-owner-password
      HDB_DATABASE_PASSWORD: isolated-test-app-password
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: hdboutique-backend:development
    build:
      context: ./backend
      target: development
    environment: &test_database
      HDB_TEST_DATABASE_HOST: db
      HDB_TEST_DATABASE_PORT: "5432"
      HDB_TEST_DATABASE_NAME: hdboutique_test
      HDB_TEST_DATABASE_USER: hdboutique_app
      HDB_TEST_DATABASE_PASSWORD: isolated-test-app-password
      # Destino canonico de ensayo para las herramientas de fase 6.
      HDB_MIGRATION_DATABASE_HOST: db
      HDB_MIGRATION_DATABASE_PORT: "5432"
      HDB_MIGRATION_DATABASE_NAME: hdboutique_test
      HDB_MIGRATION_DATABASE_USER: hdboutique_app
      HDB_MIGRATION_DATABASE_PASSWORD: isolated-test-app-password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["uv", "run", "--locked", "python", "-m", "pytest", "--run-postgres", "--cov=app", "--cov-report=term-missing"]

  seed:
    profiles: [integration]
    image: hdboutique-backend:development
    environment: *test_database
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--locked", "python", "-m", "tests.stabilization_seed"]

  api:
    profiles: [integration]
    image: hdboutique-backend:development
    environment:
      HDB_ENVIRONMENT: test
      HDB_BUSINESS_API_ENABLED: "true"
      HDB_AUTH_ORIGIN: http://127.0.0.1:4173
      HDB_SESSION_COOKIE_SECURE: "false"
      HDB_DATABASE_HOST: db
      HDB_DATABASE_PORT: "5432"
      HDB_DATABASE_NAME: hdboutique_test
      HDB_DATABASE_USER: hdboutique_app
      HDB_DATABASE_PASSWORD: isolated-test-app-password
    depends_on:
      seed:
        condition: service_completed_successfully
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      default:
        aliases: [backend]

  web:
    profiles: [integration]
    image: hdboutique-frontend:runtime
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  browser:
    profiles: [integration]
    image: hdboutique-frontend:test
    init: true
    shm_size: 1gb
    environment:
      HDB_FASTAPI_TARGET: http://api:8000
    depends_on:
      web:
        condition: service_healthy
    command: ["npm", "run", "test:integration"]
