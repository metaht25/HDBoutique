worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /health/live {
            default_type application/json;
            return 200 '{"status":"ok","scope":"web"}';
        }
        location = /health/ready { proxy_pass http://backend:8000; }
        # 2 MiB of image bytes become 2,796,204 base64 characters. Allow JSON
        # metadata too, without raising the default limit for other endpoints.
        location = /api/v1/boutique-profile {
            client_max_body_size 3m;
            error_page 413 = @logo_too_large;
            proxy_pass http://backend:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_next_upstream off;
            proxy_cache off;
            proxy_intercept_errors off;
        }
        location @logo_too_large {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 413 '{"error":{"code":"request_too_large","message":"El formulario del logo supera el límite de carga. Usa una imagen de hasta 2 MB.","fields":[{"location":["body","logo_base64"],"type":"file_too_large"}]}}';
        }
        location /api/v1/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_next_upstream off;
            proxy_cache off;
            proxy_intercept_errors off;
        }
        location /api/ { return 404; }
        location /admin/ { return 404; }
        location ~ /\. { deny all; }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
