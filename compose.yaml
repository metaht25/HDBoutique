name: hdboutique-local

services:
  backend:
    image: hdboutique-backend:runtime
    build:
      context: ./backend
      target: runtime
    environment:
      HDB_ENVIRONMENT: production
      HDB_DEBUG: "false"
      HDB_BUSINESS_API_ENABLED: ${HDB_BUSINESS_API_ENABLED:-false}
      HDB_AUTH_ORIGIN: ${HDB_AUTH_ORIGIN:-https://localhost}
      HDB_SESSION_COOKIE_SECURE: ${HDB_SESSION_COOKIE_SECURE:-true}
      HDB_DATABASE_HOST: db
      HDB_DATABASE_PORT: "5432"
      HDB_DATABASE_NAME: ${POSTGRES_DB:-hdboutique}
      HDB_DATABASE_USER: hdboutique_app
      HDB_DATABASE_PASSWORD: ${HDB_DATABASE_PASSWORD:?Generate .env.docker first}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hdboutique}
      POSTGRES_USER: hdboutique_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.docker first}
      HDB_DATABASE_PASSWORD: ${HDB_DATABASE_PASSWORD:?Generate .env.docker first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

volumes:
  postgres_data:
