name: hdboutique-dev

services:
  backend:
    image: hdboutique-backend:development
    build:
      target: development
    environment:
      HDB_ENVIRONMENT: development
      HDB_BUSINESS_API_ENABLED: "true"
      HDB_AUTH_ORIGIN: http://127.0.0.1:${WEB_PORT:-8080}
      HDB_SESSION_COOKIE_SECURE: "false"
    read_only: false
    volumes:
      - ./backend/app:/workspace/backend/app:ro
      - ./backend/alembic.ini:/workspace/backend/alembic.ini:ro
      - ./backend/migrations:/workspace/backend/migrations
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  web:
    image: hdboutique-frontend:runtime
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
